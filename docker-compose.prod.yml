# Production deployment. Named separately from "docker-compose.yml" (that
# one is the local pgAdmin-only dev compose) so deploy scripts must always
# pass `-f docker-compose.prod.yml` explicitly, never the default name.
#
# Postgres/Redis are native to the host, shared — reached via 172.17.0.1
# (see .env), not started by this compose.
#
# backend, celery-worker, and celery-beat share one image, each with a
# different `command:`. Migrations only run in backend's CMD (see
# Dockerfile) so the three don't race to migrate at once.
services:
  backend:
    build:
      context: ./backend
    container_name: northern-lights-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8093:8000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m

  celery-worker:
    build:
      context: ./backend
    container_name: northern-lights-celery-worker
    restart: unless-stopped
    env_file: .env
    networks:
      - app-network
    command: uv run celery -A app.core.celery worker --loglevel=info --concurrency=2
    depends_on:
      - backend
    mem_limit: 512m

  celery-beat:
    build:
      context: ./backend
    container_name: northern-lights-celery-beat
    restart: unless-stopped
    env_file: .env
    networks:
      - app-network
    command: uv run celery -A app.core.celery beat --loglevel=info
    depends_on:
      - backend
    mem_limit: 128m

  frontend:
    build:
      context: ./frontend-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_APP_ENV: production
    container_name: northern-lights-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8094:80"
    networks:
      - app-network
    mem_limit: 128m

networks:
  app-network:
    name: northern-lights-network
