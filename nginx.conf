# Vhost for the host's native Nginx (not nginx.spa.conf, which lives inside
# the frontend container).
#
# Deploy this AS-IS (port 80 only) BEFORE running certbot -- `certbot
# --nginx -d your-domain.example.com` adds the 443/SSL block itself. Writing
# a 443 block by hand first makes `nginx -t` fail (no certificate yet).
#
# Routes by path: /api/* -> backend (8093), everything else -> frontend (8094).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name your-domain.example.com;

    location /api/ {
        # Default is 1MB -- too little for PDF bank statement attachments
        # (see MAX_IMPORT_ATTACHMENT_BYTES in ai.py).
        client_max_body_size 20M;
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
