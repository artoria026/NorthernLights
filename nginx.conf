# Vhost del Nginx NATIVO del host (no confundir con nginx.spa.conf, que vive
# DENTRO del contenedor frontend).
#
# OJO — orden de despliegue (ver infra/context/nginx.md): este archivo debe
# copiarse y activarse TAL CUAL (solo puerto 80, sin bloque SSL) ANTES de
# correr certbot. `certbot --nginx -d nligths.duckdns.org` es quien agrega el
# bloque `listen 443 ssl` con las rutas reales del certificado y reescribe
# este bloque de 80 como redirect — igual que en gatos-deportiva,
# prueba-tecnica y roundup (ver reports/nginx-audit.md). Si se escribe el
# bloque 443 a mano antes de tener el certificado, `nginx -t` falla porque el
# archivo del certificado todavia no existe y certbot no puede ni arrancar.
#
# Rutea por path dentro del mismo dominio: /api/* -> backend (8093),
# el resto -> frontend estatico (8094).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name nligths.duckdns.org;

    location /api/ {
        # Default de Nginx es 1MB -- muy poco para adjuntar estados de cuenta
        # en PDF a /ai/import (ver MAX_IMPORT_ATTACHMENT_BYTES en ai.py, 15MB
        # por archivo, hasta 5 archivos).
        client_max_body_size 20M;
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# A partir de aqui, `sudo certbot --nginx -d nligths.duckdns.org` agrega solo
# el bloque 443 con los certificados y convierte este bloque de 80 en un
# redirect 301 -- no lo escribas a mano.
