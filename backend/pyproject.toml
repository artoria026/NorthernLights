[project]
name = "finanzas-backend"
version = "1.0.0"
description = "App Finanzas Personales - backend"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    # Base de datos
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Validacion y configuracion
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",  # passlib 1.7.4 (sin mantenimiento) rompe con bcrypt>=4.1
    # Cache y task queue
    "redis>=5.0.0",
    "celery[redis]>=5.3.0",
    # AI
    "anthropic>=0.25.0",
    "google-genai>=2.16.0",
    # Logging
    "structlog>=24.0.0",
    # HTTP client
    "httpx>=0.27.0",
    # Fechas
    "python-dateutil>=2.9.0",
    "openpyxl>=3.1.5",
    "pypdf>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]
ignore = [
    "B008",   # Depends(...) en defaults es el patron idiomatico de FastAPI
    "DTZ011", # date.today() es correcto para fechas de negocio (no timestamps)
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # DDL en bruto no se reformatea a 100 cols

[tool.mypy]
python_version = "3.12"
strict = true
