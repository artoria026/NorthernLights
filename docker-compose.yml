# Postgres/Redis run natively on the host (see README), not as containers.
# pgAdmin (optional) reaches native Postgres via host.docker.internal.
services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finanzas_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finanzas.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
    ports:
      - "5050:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - tools
